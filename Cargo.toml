[workspace]
members = ["crates/artifactd-protocol"]
resolver = "3"

[package]
name = "apollo-artifactd"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Standalone content-addressed OCI artifact service"

[dependencies]
artifactd-protocol = { path = "crates/artifactd-protocol", version = "0.1.0" }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "net", "process", "event"] }
cap-std = "4"
oci-spec = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true

[[bin]]
name = "apollo-artifactd"
path = "src/main.rs"

[[bin]]
name = "apollo-artifactctl"
path = "src/cli.rs"
