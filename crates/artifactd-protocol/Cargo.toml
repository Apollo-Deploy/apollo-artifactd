[package]
name = "artifactd-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Generic versioned artifact daemon contract"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["net", "event", "process", "fs"] }
