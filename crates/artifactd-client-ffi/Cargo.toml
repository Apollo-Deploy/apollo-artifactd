[package]
name = "artifactd-client-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Rust-owned C ABI client for the generic apollo-artifactd protocol"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
artifactd-protocol = { path = "../artifactd-protocol", version = "0.1.0" }
oci-spec = "0.9"
serde_json = "1"
thiserror = "2"
